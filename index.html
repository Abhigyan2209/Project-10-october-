iiioAKKKKAF0UUUAFFFFAH/2Q==);
  --ink:#170505; --cream:#fff1d6; --gold:#ffd98a; --marigold:#f5b83d; --ember:#ff8a3d; --sindoor:#e0402a;
  --px:0; --py:0; --scroll:0;
  --h:100vh; --h:100svh;           /* stable viewport height, with fallback */
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--ink);color:var(--cream);font-family:'DM Sans',system-ui,-apple-system,sans-serif;
  overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}

/* ============ SCENE ============ */
.scene{position:fixed;inset:0;overflow:hidden;isolation:isolate;background:var(--ink)}
.layer{position:absolute;will-change:transform}
.bg-blur{inset:-8%;background:var(--img) center/cover no-repeat;
  filter:blur(36px) saturate(1.5) brightness(.55);
  transform:translate3d(calc(var(--px)*-8px),calc(var(--py)*-8px),0) scale(1.2)}
.idol{
  left:-12%;right:-12%;top:calc(var(--h)*.27);height:calc(var(--h)*.50);
  background:var(--img) 50% 40%/cover no-repeat;
  filter:contrast(1.1) saturate(1.2) sepia(.14) brightness(.98);
  -webkit-mask-image:radial-gradient(ellipse 56% 60% at 50% 50%,#000 52%,transparent 100%);
          mask-image:radial-gradient(ellipse 56% 60% at 50% 50%,#000 52%,transparent 100%);
  transform:translate3d(calc(var(--px)*14px),calc(var(--py)*10px + var(--scroll)*-22px),0) scale(1.03);
  animation:breathe 9s ease-in-out infinite}
@keyframes breathe{50%{filter:contrast(1.12) saturate(1.3) sepia(.16) brightness(1.08)}}
.halo{inset:auto 0 auto 0;top:calc(var(--h)*.36);height:calc(var(--h)*.3);pointer-events:none;
  background:radial-gradient(ellipse 45% 50% at 50% 50%,rgba(255,176,70,.34),transparent 72%);
  mix-blend-mode:screen;animation:halo 7s ease-in-out infinite}
@keyframes halo{50%{opacity:.55}}
.grade{position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(180deg,rgba(23,5,5,.94) 0%,rgba(23,5,5,.55) 16%,rgba(23,5,5,.08) 36%,rgba(23,5,5,0) 50%,rgba(23,5,5,.55) 70%,rgba(23,5,5,.96) 100%),
    radial-gradient(ellipse 120% 80% at 50% 45%,transparent 55%,rgba(10,2,2,.65) 100%)}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.13;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.embers{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.embers i{position:absolute;bottom:-10px;width:4px;height:4px;border-radius:50%;
  background:radial-gradient(circle,#ffd98a,#ff8a2a 60%,transparent 70%);opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translate3d(0,0,0);opacity:0}12%{opacity:.8}100%{transform:translate3d(var(--dx),calc(var(--h)*-.7),0);opacity:0}}

/* ============ TOP BAR ============ */
.top{position:fixed;top:0;left:0;right:0;z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px))}
.live{grid-column:2;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;letter-spacing:.02em;
  padding:7px 14px;border-radius:99px;background:rgba(23,5,5,.38);
  border:1px solid rgba(255,241,214,.2);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-variant-numeric:tabular-nums}
.dot{width:7px;height:7px;border-radius:50%;background:#ff4b3a;animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,75,58,.7)}70%,100%{box-shadow:0 0 0 8px rgba(255,75,58,0)}}
.socials{grid-column:3;justify-self:end;display:flex;gap:2px}
.socials a{color:var(--cream);opacity:.85;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;transition:opacity .2s,background .2s}
.socials a:hover{opacity:1;background:rgba(255,241,214,.1)}
.socials a:focus-visible{outline:2px solid var(--marigold);outline-offset:1px}
.socials svg{width:18px;height:18px;fill:currentColor}

/* ============ HEADLINE ============ */
.hero{position:fixed;left:0;right:0;z-index:4;text-align:center;padding:0 16px;pointer-events:none;
  top:calc(env(safe-area-inset-top,0px) + var(--h)*.105);
  transform:translate3d(calc(var(--px)*-6px),calc(var(--py)*-4px + var(--scroll)*-36px),0)}
.hero h1{font-weight:400;line-height:1.06;filter:drop-shadow(0 3px 0 rgba(90,16,10,.6)) drop-shadow(0 12px 24px rgba(0,0,0,.7));animation:glow 6s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 3px 0 rgba(90,16,10,.6)) drop-shadow(0 12px 24px rgba(0,0,0,.7)) drop-shadow(0 0 20px rgba(255,170,60,.45))}}
.hero h1 span{display:block;background:linear-gradient(180deg,#fff7e2 6%,#ffd98a 55%,#f0a03a 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  animation:rise-in 1.3s cubic-bezier(.2,.7,.2,1) both}
.hero h1 .l1{font-family:'Rozha One','Tiro Devanagari Hindi',serif;font-size:clamp(44px,min(16vw,9.6*var(--h)/100),104px);padding-top:.12em}
.hero h1 .l2{font-family:'Tiro Devanagari Hindi','Rozha One',serif;font-size:clamp(28px,min(10vw,6*var(--h)/100),66px);margin-top:.04em;animation-delay:.22s}
.hero p{font-family:'Tiro Devanagari Hindi',serif;font-size:clamp(13px,3.6vw,16px);line-height:1.5;color:rgba(255,241,214,.88);
  margin-top:12px;text-shadow:0 1px 10px rgba(0,0,0,.85),0 0 2px rgba(0,0,0,.6);animation:fade-in 1.4s .7s ease both}
@keyframes rise-in{from{opacity:0;transform:translateY(14px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes fade-in{from{opacity:0}to{opacity:1}}

/* ============ PLAYER ============ */
.player{position:fixed;z-index:6;left:50%;transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom,0px) + 40px);
  width:min(340px,calc(100vw - 28px));padding:13px 14px 12px;border-radius:24px;
  background:linear-gradient(150deg,rgba(255,241,214,.2),rgba(255,241,214,.07) 55%),rgba(28,8,6,.5);
  border:1px solid rgba(255,241,214,.26);
  box-shadow:0 22px 60px rgba(0,0,0,.6),0 0 0 .5px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(255,170,60,.08);
  backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5)}
.row1{display:flex;gap:12px;align-items:center}
.art{width:52px;height:52px;flex:none;border-radius:12px;background:var(--img) 50% 28%/270% no-repeat;
  box-shadow:0 5px 16px rgba(0,0,0,.5),0 0 0 1px rgba(255,241,214,.18);position:relative;overflow:hidden}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.art.has img{display:block}
.meta{min-width:0;flex:1}
.title{font-weight:700;font-size:14.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff8e8}
.sub{font-size:12px;color:rgba(255,241,214,.76);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.prog{display:flex;align-items:center;gap:9px;margin-top:6px;font-size:10.5px;color:rgba(255,241,214,.8);font-variant-numeric:tabular-nums}
.prog span{min-width:28px}
.prog span:last-child{text-align:right}
.bar{flex:1;height:28px;display:flex;align-items:center;cursor:pointer;touch-action:none;border-radius:6px}
.bar b{display:block;width:100%;height:4px;border-radius:4px;background:rgba(255,241,214,.22);position:relative}
.bar b i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:4px;background:linear-gradient(90deg,var(--marigold),var(--ember))}
.bar b i::after{content:"";position:absolute;right:-6px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:#fff3d6;box-shadow:0 0 10px rgba(255,170,60,.95)}
.row3{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;margin-top:2px}
.ctrls{display:flex;align-items:center;gap:2px}
.btn{width:46px;height:46px;border:0;background:none;display:grid;place-items:center;border-radius:50%;cursor:pointer;
  transition:background .2s,transform .15s,opacity .2s;touch-action:manipulation}
.btn:hover{background:rgba(255,241,214,.14)}
.btn:active{transform:scale(.9)}
.btn svg{width:22px;height:22px;fill:currentColor}
.btn.play{width:56px;height:56px;background:linear-gradient(145deg,#ffe2a0,#f0a03a);color:#3a0d08;
  box-shadow:0 8px 22px rgba(240,160,58,.5),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.play:hover{background:linear-gradient(145deg,#ffe9b8,#f5ad4d)}
.btn.play svg{width:26px;height:26px}
.btn[disabled]{opacity:.28;pointer-events:none}
.btn:focus-visible,.knob:focus-visible,.bar:focus-visible{outline:2px solid var(--marigold);outline-offset:2px}
.knob{--v:80;justify-self:start;width:36px;height:36px;margin:2px;border-radius:50%;position:relative;cursor:grab;touch-action:none;
  background:radial-gradient(circle at 35% 28%,#7a3320,#2a0a06);border:1px solid rgba(255,241,214,.34);
  box-shadow:0 3px 8px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.22)}
.knob::before{content:"";position:absolute;inset:-5px;border-radius:50%;pointer-events:none;
  background:conic-gradient(from 225deg,var(--marigold) calc(var(--v)*2.7deg),rgba(255,241,214,.2) 0 270deg,transparent 0);
  -webkit-mask:radial-gradient(circle,transparent 20px,#000 21px);mask:radial-gradient(circle,transparent 20px,#000 21px)}
.knob::after{content:"";position:absolute;left:50%;top:4px;width:2.5px;height:9px;margin-left:-1.25px;border-radius:2px;background:var(--gold);
  transform-origin:1.25px 14px;transform:rotate(var(--rot,90deg))}
.knob.off{opacity:.3;pointer-events:none}
.tag{justify-self:end;font-size:9px;font-weight:700;letter-spacing:.09em;color:#3a0d08;white-space:nowrap;
  background:linear-gradient(135deg,var(--gold),var(--marigold));padding:5px 7px;border-radius:7px;box-shadow:0 2px 8px rgba(0,0,0,.35)}

/* ============ CREDIT ============ */
.credit{position:fixed;z-index:6;left:0;right:0;text-align:center;font-size:11px;color:rgba(255,241,214,.74);
  bottom:calc(env(safe-area-inset-bottom,0px) + 14px);letter-spacing:.03em;text-shadow:0 1px 8px rgba(0,0,0,.9)}
.credit em{font-style:normal;color:#ff6a55}
.credit a{color:var(--gold);text-decoration:none}

.hidden-host,.hidden-host *{pointer-events:none!important}
.hidden-host{position:fixed;left:-9999px;top:0;width:320px;height:200px;opacity:0;pointer-events:none}

/* ============ RESPONSIVE ============ */
@media (max-height:700px){            /* short phones (SE, small Androids) */
  .hero p{display:none}
  .player{bottom:calc(env(safe-area-inset-bottom,0px) + 34px);padding:11px 13px 9px}
  .idol{top:calc(var(--h)*.24);height:calc(var(--h)*.5)}
  .halo{top:calc(var(--h)*.33)}
}
@media (max-width:350px){ .tag{font-size:8px;padding:4px 5px} .btn{width:42px} }
@media (min-aspect-ratio:1/1){        /* landscape & desktop: show the whole pandal */
  .idol{left:12%;right:12%;top:calc(var(--h)*.2);height:calc(var(--h)*.6);background-size:contain;background-position:center;
    -webkit-mask-image:radial-gradient(ellipse 60% 62% at 50% 50%,#000 55%,transparent 100%);mask-image:radial-gradient(ellipse 60% 62% at 50% 50%,#000 55%,transparent 100%)}
  .halo{top:calc(var(--h)*.3)}
  .hero{top:calc(env(safe-area-inset-top,0px) + var(--h)*.07)}
  .hero h1 .l1{font-size:clamp(40px,10vh,90px)} .hero h1 .l2{font-size:clamp(26px,6vh,56px)}
  .hero p{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .layer,.hero{transform:none!important}
}
</style>
</head>
<body>

<main class="hero" id="hero">

<section class="player" aria-label="Music player">
  <div class="row1">

      <button class="btn play" id="play" aria-label="Play"><svg id="playIco" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="btn" id="next" aria-label="Next track"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.8 5H18v14h-2.2zM5 5.5v13L14.5 12z"/></svg></button>

<div class="hidden-host" aria-hidden="true"><div id="yt"></div></div>
<div class="hidden-host" id="spHost" aria-hidden="true" inert><div id="sp"></div></div>

<script>
/* =====================================================
   CONFIG
   YOUTUBE_PLAYLIST_ID → id after "list=" in a YouTube playlist URL.
     Gives full play/pause, prev/next, seek, volume, thumbnails.
   Left empty → plays the Spotify playlist through Spotify's official
     iFrame API. The embed stays hidden and non-interactive, so the page
     shows no Spotify links; visitors only see this site's own controls.
     (play/pause + progress + seek only; the API has no prev/next/volume,
     and listeners not logged in to Spotify get 30s previews.)
   ===================================================== */
const YOUTUBE_PLAYLIST_ID = '';
const SPOTIFY_PLAYLIST_ID = '0yqjTnDqWSdxPXyu2aIPdw';

const $ = id => document.getElementById(id);
const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };
const state = { playing:false, cur:0, dur:0 };
const ICON_PLAY  = '<path d="M8 5v14l11-7z"/>';
const ICON_PAUSE = '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
let audio = null;

function paint(){
  $('playIco').innerHTML = state.playing ? ICON_PAUSE : ICON_PLAY;
  $('play').setAttribute('aria-label', state.playing ? 'Pause' : 'Play');
  $('cur').textContent = fmt(state.cur);
  $('dur').textContent = fmt(state.dur);
  const pct = state.dur ? Math.min(100, state.cur / state.dur * 100) : 0;
  $('fill').style.width = pct + '%';
  $('bar').setAttribute('aria-valuenow', Math.round(pct));
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = state.playing ? 'playing' : 'paused';
}
function setMeta(title, sub, thumb){
  $('title').textContent = title; $('sub').textContent = sub;
  if (thumb){ $('artImg').src = thumb; $('art').classList.add('has'); } else $('art').classList.remove('has');
  if ('mediaSession' in navigator && window.MediaMetadata)
    navigator.mediaSession.metadata = new MediaMetadata({ title, artist:sub, album:'दुर्गा पूजा की यादें' });
}
function fail(msg){ $('sub').textContent = msg; }
$('artImg').onerror = () => $('art').classList.remove('has');

/* ---------- YouTube (hidden IFrame API player) ---------- */
function bootYouTube(){
  let p = null, errStreak = 0, loaded = false;
  const s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  s.onerror = () => fail('Couldn’t load YouTube — check your connection');
  document.head.appendChild(s);
  setTimeout(() => { if (!loaded) fail('Player is taking long to load…'); }, 7000);

  window.onYouTubeIframeAPIReady = () => {
    p = new YT.Player('yt', {
      width:'200', height:'200',
      playerVars:{ listType:'playlist', list:YOUTUBE_PLAYLIST_ID, controls:0, playsinline:1, modestbranding:1, rel:0, disablekb:1, origin:location.origin.startsWith('http') ? location.origin : undefined },
      events:{
        onReady:() => { loaded = true; p.setVolume(vol); $('sub').textContent = 'Tap play to begin'; },
        onStateChange:e => {
          state.playing = e.data === YT.PlayerState.PLAYING;
          if (state.playing){ errStreak = 0; readMeta(); }
          if (e.data === YT.PlayerState.ENDED){
            const list = p.getPlaylist && p.getPlaylist();
            if (list && p.getPlaylistIndex() === list.length - 1) p.playVideoAt(0);   // loop playlist
          }
          paint();
        },
        onError:() => {
          const list = (p.getPlaylist && p.getPlaylist()) || [];
          if (++errStreak > Math.max(2, list.length)) { fail('No playable tracks in this playlist'); return; }
          fail('Track unavailable — skipping'); setTimeout(() => p.nextVideo(), 700);
        }
      }
    });
    setInterval(() => {
      if (!p || !p.getCurrentTime || !loaded) return;
      state.cur = p.getCurrentTime() || 0; state.dur = p.getDuration() || 0; paint();
    }, 400);
  };
  function readMeta(){
    try{
      const d = p.getVideoData(); if (!d || !d.title) return;
      setMeta(d.title, d.author || 'Playlist', d.video_id ? 'https://i.ytimg.com/vi/' + d.video_id + '/mqdefault.jpg' : '');
    }catch(e){}
  }
  audio = {
    toggle:() => { if (!p || !p.playVideo) return; state.playing ? p.pauseVideo() : p.playVideo(); },
    next:() => p && p.nextVideo && p.nextVideo(),
    prev:() => { if (!p) return; p.getCurrentTime() > 4 ? p.seekTo(0, true) : p.previousVideo(); },
    seek:sec => p && p.seekTo && p.seekTo(sec, true),
    setVolume:v => p && p.setVolume && p.setVolume(v)
  };
}

/* ---------- Spotify (hidden iFrame API fallback) ---------- */
function bootSpotify(){
  $('prev').disabled = true; $('next').disabled = true;
  $('knob').classList.add('off'); $('knob').title = 'Volume isn’t available for Spotify embeds — use your device volume';
  setMeta('Durga Puja Playlist', 'Loading player…');
  let ctrl = null;
  const s = document.createElement('script');
  s.src = 'https://open.spotify.com/embed/iframe-api/v1'; s.async = true;
  s.onerror = () => fail('Couldn’t load Spotify — check your connection');
  document.head.appendChild(s);
  setTimeout(() => {
    if (!ctrl) fail('Player is taking long to load — try refreshing');
  }, 8000);
  window.onSpotifyIframeApiReady = IFrameAPI => {
    IFrameAPI.createController($('sp'), { uri:'spotify:playlist:' + SPOTIFY_PLAYLIST_ID, width:300, height:152 }, c => {
      ctrl = c; $('sub').textContent = 'Tap play to begin';
      const f = $('spHost').querySelector('iframe'); if (f){ f.tabIndex = -1; f.setAttribute('aria-hidden','true'); }
      c.addListener('playback_update', e => {
        const d = e.data; if (!d) return;
        state.playing = !d.isPaused;
        state.cur = (d.position || 0) / 1000; state.dur = (d.duration || 0) / 1000; paint();
      });
    });
  };
  audio = {
    toggle:() => ctrl && ctrl.togglePlay(),
    next:() => {}, prev:() => {},
    seek:sec => ctrl && ctrl.seek(sec),
    setVolume:null
  };
}

/* ---------- Controls ---------- */
$('play').onclick = () => audio && audio.toggle();
$('next').onclick = () => audio && audio.next();
$('prev').onclick = () => audio && audio.prev();

const bar = $('bar'); let seeking = false;
function seekFromEvent(e){
  if (!state.dur || !audio) return;
  const r = bar.getBoundingClientRect();
  const f = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  state.cur = f * state.dur; paint(); audio.seek(state.cur);
}
bar.addEventListener('pointerdown', e => { seeking = true; bar.setPointerCapture(e.pointerId); seekFromEvent(e); });
bar.addEventListener('pointermove', e => { if (seeking) seekFromEvent(e); });
bar.addEventListener('pointerup', () => seeking = false);
bar.addEventListener('pointercancel', () => seeking = false);
bar.addEventListener('keydown', e => {
  if (!audio || !state.dur) return;
  if (e.key === 'ArrowRight') audio.seek(Math.min(state.dur, state.cur + 5));
  if (e.key === 'ArrowLeft')  audio.seek(Math.max(0, state.cur - 5));
});

/* Volume knob — drag around the dial (−135° … +135°) */
const knob = $('knob'); let vol = 80, turning = false;
function setKnob(v){
  vol = Math.round(Math.min(100, Math.max(0, v)));
  knob.style.setProperty('--rot', (-135 + vol * 2.7) + 'deg');
  knob.style.setProperty('--v', vol);
  knob.setAttribute('aria-valuenow', vol);
  audio && audio.setVolume && audio.setVolume(vol);
}
function turn(e){
  const r = knob.getBoundingClientRect();
  const a = Math.atan2(e.clientY - (r.top + r.height/2), e.clientX - (r.left + r.width/2)) * 180 / Math.PI + 90;
  let d = ((a + 540) % 360) - 180;
  setKnob((Math.max(-135, Math.min(135, d)) + 135) / 270 * 100);
}
knob.addEventListener('pointerdown', e => { turning = true; knob.setPointerCapture(e.pointerId); knob.style.cursor = 'grabbing'; turn(e); });
knob.addEventListener('pointermove', e => turning && turn(e));
knob.addEventListener('pointerup', () => { turning = false; knob.style.cursor = 'grab'; });
knob.addEventListener('pointercancel', () => turning = false);
knob.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp' || e.key === 'ArrowRight') { setKnob(vol + 5); e.preventDefault(); }
  if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') { setKnob(vol - 5); e.preventDefault(); }
});
setKnob(80);

/* Lock-screen / headset controls */
if ('mediaSession' in navigator){
  const set = (a, f) => { try{ navigator.mediaSession.setActionHandler(a, f); }catch(e){} };
  set('play',  () => audio && !state.playing && audio.toggle());
  set('pause', () => audio && state.playing && audio.toggle());
  set('nexttrack', () => audio && audio.next());
  set('previoustrack', () => audio && audio.prev());
}

YOUTUBE_PLAYLIST_ID ? bootYouTube() : bootSpotify();

/* ---------- Ambient motion ---------- */
const root = document.documentElement;
let tx = 0, ty = 0, cx = 0, cy = 0, sc = 0, sSm = 0, lastY = null;
addEventListener('pointermove', e => { if (e.pointerType === 'mouse'){ tx = e.clientX / innerWidth - .5; ty = e.clientY / innerHeight - .5; } });
addEventListener('deviceorientation', e => {
  if (e.gamma == null) return;
  tx = Math.max(-.5, Math.min(.5, e.gamma / 60)); ty = Math.max(-.5, Math.min(.5, (e.beta - 45) / 90));
});
addEventListener('wheel', e => { sc = Math.max(0, Math.min(1, sc + e.deltaY / 1500)); }, { passive:true });
addEventListener('touchmove', e => {
  const y = e.touches[0].clientY;
  if (lastY != null) sc = Math.max(0, Math.min(1, sc - (y - lastY) / 700));
  lastY = y;
}, { passive:true });
addEventListener('touchend', () => lastY = null);
if (!matchMedia('(prefers-reduced-motion: reduce)').matches){
  (function loop(){
    const nx = cx + (tx - cx) * .06, ny = cy + (ty - cy) * .06, ns = sSm + (sc - sSm) * .08;
    if (Math.abs(nx - cx) + Math.abs(ny - cy) + Math.abs(ns - sSm) > .0004){   // skip idle frames
      cx = nx; cy = ny; sSm = ns;
      root.style.setProperty('--px', cx.toFixed(4));
      root.style.setProperty('--py', cy.toFixed(4));
      root.style.setProperty('--scroll', sSm.toFixed(4));
    }
    requestAnimationFrame(loop);
  })();
}

/* Real viewport height for browsers without svh */
if (!(window.CSS && CSS.supports && CSS.supports('height','100svh'))){
  const setH = () => root.style.setProperty('--h', innerHeight + 'px');
  setH(); addEventListener('resize', setH);
}

/* drifting embers */
const em = $('embers');
if (!matchMedia('(prefers-reduced-motion: reduce)').matches)
for (let i = 0; i < 16; i++){
  const b = document.createElement('i');
  b.style.left = (Math.random() * 100) + '%';
  b.style.setProperty('--dx', (Math.random() * 60 - 30) + 'px');
  b.style.animationDuration = (9 + Math.random() * 9) + 's';
  b.style.animationDelay = (-Math.random() * 14) + 's';
  b.style.width = b.style.height = (2.5 + Math.random() * 3.5) + 'px';
  em.appendChild(b);
}

/* decorative "online" count (simulated) */
let online = 28 + Math.floor(Math.random() * 14);
const showOnline = () => $('online').textContent = online + ' online';
showOnline();
setInterval(() => { online = Math.max(18, Math.min(64, online + Math.floor(Math.random() * 5) - 2)); showOnline(); }, 3800);

paint();
</script>
