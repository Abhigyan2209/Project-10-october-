<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14050b">
<title>दुर्गा पूजा — वो पुरानी यादें</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#fff1d6; --gold:#ffd27a; --marigold:#f6a623; --vermil:#e2492f; --ink:#3a0f16;
  --px:0; --py:0; --sy:0;
  --it:33%; --ih:42vh;            /* idol top/height, refined by JS */
  --vh:1vh;
}
@supports (height:1dvh){:root{--vh:1dvh;--ih:42dvh}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#12040a;color:var(--cream);font-family:'Poppins',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit}
.stage{position:fixed;inset:0;overflow:hidden;isolation:isolate;height:100vh;height:100dvh}

/* ================= SCENE ================= */
.layer{position:absolute;inset:-4%;will-change:transform}
.sky{background:
  radial-gradient(70% 38% at 50% 54%,rgba(255,150,40,.55),transparent 72%),
  radial-gradient(120% 70% at 50% 108%,#7a1d14 0%,transparent 60%),
  linear-gradient(180deg,#120518 0%,#2a0a24 22%,#5a1424 48%,#8f2a1a 74%,#2a0810 100%);
  transform:translate3d(calc(var(--px)*-6px),calc(var(--py)*-6px),0)}
.stars{background-image:
  radial-gradient(1.2px 1.2px at 12% 8%,#fff8,transparent),radial-gradient(1px 1px at 78% 6%,#fff9,transparent),
  radial-gradient(1.4px 1.4px at 40% 14%,#ffe9b8,transparent),radial-gradient(1px 1px at 90% 20%,#fff8,transparent),
  radial-gradient(1px 1px at 22% 24%,#fff7,transparent),radial-gradient(1.2px 1.2px at 62% 11%,#fff9,transparent),
  radial-gradient(1px 1px at 6% 30%,#fff6,transparent),radial-gradient(1px 1px at 70% 28%,#fff6,transparent);
  animation:twinkle 6s ease-in-out infinite alternate;transform:translate3d(calc(var(--px)*-10px),calc(var(--py)*-10px),0)}
@keyframes twinkle{from{opacity:.5}to{opacity:1}}
.moon{position:absolute;right:11%;top:14%;width:50px;height:50px;border-radius:50%;
  background:radial-gradient(circle at 38% 35%,#fff6e0,#f4cf8e 60%,#d9a45a);
  box-shadow:0 0 40px 14px rgba(255,200,120,.26),0 0 120px 40px rgba(255,160,70,.16);opacity:.85}
.skyline{position:absolute;left:0;right:0;bottom:20%;height:30%;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 200'><g fill='%231b0612'><path d='M0 200V150l30-8 12-34 10 34 28 6 14-52 6-14 6 14 14 52 24-4 14-40 12-24 12 24 14 40 28 6v70z'/><path d='M270 200v-70h40v-24l20-30 20 30v24h40v70z'/><path d='M400 200v-90l30-50 30 50v90z'/><path d='M520 200v-60l20-10 8-36 8-14 8 14 8 36 20 10v60z'/><path d='M640 200v-80l24-14 6-30 6-14 6 14 6 30 24 14v80z'/><path d='M740 200v-40l30-10 30 8v42z'/></g></svg>") center bottom/cover no-repeat;
  opacity:.75;transform:translate3d(calc(var(--px)*-14px),calc(var(--py)*-6px),0)}

/* idol */
.idol-wrap{position:absolute;left:50%;top:var(--it);height:var(--ih);aspect-ratio:682/450;pointer-events:none;will-change:transform;
  transform:translate3d(calc(-50% + var(--px)*10px),calc(var(--py)*6px + var(--sy)*-.04px),0)}
.rays{position:absolute;left:50%;top:44%;width:190%;aspect-ratio:1;margin:-95% 0 0 -95%;border-radius:50%;opacity:.28;
  background:repeating-conic-gradient(from 0deg,rgba(255,196,110,.55) 0 4deg,transparent 4deg 15deg);
  -webkit-mask:radial-gradient(closest-side,#000 0,transparent 70%);mask:radial-gradient(closest-side,#000 0,transparent 70%);
  animation:spin 160s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.idol-glow{position:absolute;inset:-22%;background:radial-gradient(closest-side,rgba(255,170,60,.52),rgba(255,110,40,.18) 55%,transparent 76%);
  mix-blend-mode:screen;animation:glow 5.5s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.55;transform:scale(.97)}to{opacity:1;transform:scale(1.04)}}

.idol{filter:saturate(1.18) contrast(1.07) sepia(.14) brightness(1.03)}
.idol-bloom{filter:blur(9px) saturate(1.5) brightness(1.25);mix-blend-mode:screen;opacity:.38}

.garland{position:absolute;top:-4px;left:0;width:100%;height:calc(21*var(--vh));pointer-events:none;
  transform:translate3d(calc(var(--px)*16px),calc(var(--py)*8px),0)}
.garland svg{width:100%;height:100%;display:block;transform-origin:50% 0;animation:sway 7s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-.5deg)}to{transform:rotate(.5deg)}}
.kaash{position:absolute;left:-3%;right:-3%;bottom:-2%;height:calc(25*var(--vh));pointer-events:none;
  transform:translate3d(calc(var(--px)*24px),calc(var(--py)*10px),0)}
.kaash svg{width:100%;height:100%;display:block;transform-origin:50% 100%;animation:grass 9s ease-in-out infinite alternate}
@keyframes grass{from{transform:skewX(-.8deg)}to{transform:skewX(.8deg)}}
.embers{position:absolute;inset:0;pointer-events:none}
.embers i{position:absolute;bottom:-10px;width:3px;height:3px;border-radius:50%;background:var(--marigold);box-shadow:0 0 8px 2px rgba(255,170,60,.8);opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translate(0,0);opacity:0}15%{opacity:.9}100%{transform:translate(var(--dx),-70vh);opacity:0}}
.grade{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 45%,transparent 45%,rgba(10,2,6,.74) 100%),
  linear-gradient(180deg,rgba(14,3,8,.5),transparent 24%,transparent 58%,rgba(20,3,9,.78))}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.11;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}

/* ================= UI ================= */
.ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);pointer-events:none}
.ui>*{pointer-events:auto}
.topbar{width:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 14px 0}
.glass-chip{background:rgba(26,7,12,.46);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border:1px solid rgba(255,225,170,.2)}
.live{grid-column:2;display:flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:99px;font-size:12.5px;font-weight:500;color:#fff4dc}
.dot{position:relative;width:8px;height:8px;border-radius:50%;background:#ff5a3c;flex:none}
.dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:#ff5a3c;animation:ping 1.8s ease-out infinite}
@keyframes ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(3.2);opacity:0}}
.socials{grid-column:3;justify-self:end;display:flex;gap:8px}
.socials a{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:#fff4dc;transition:background .2s,transform .15s}
.socials a:hover{background:rgba(255,190,90,.28)}
.socials a:active{transform:scale(.92)}
.socials svg{width:17px;height:17px;fill:currentColor}

h1{margin-top:clamp(10px,3.4*var(--vh),34px);text-align:center;font-family:'Rozha One','Tiro Devanagari Hindi','Noto Serif Devanagari',serif;font-weight:400;line-height:1.08;padding:0 12px;
  transform:translate3d(calc(var(--px)*-4px),calc(var(--py)*-3px),0)}
h1 span{display:block}
h1 .l1{font-size:clamp(50px,min(17vw,10.5*var(--vh)),104px);
  background:linear-gradient(180deg,#fffaf0 8%,#ffd98a 58%,#f2a32a);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 rgba(90,16,25,.95)) drop-shadow(0 8px 20px rgba(0,0,0,.7)) drop-shadow(0 0 28px rgba(255,150,50,.35))}
h1 .l2{font-size:clamp(25px,min(8vw,4.6*var(--vh)),50px);margin-top:.08em;color:#ffe9c4;
  text-shadow:0 2px 0 rgba(90,16,25,.9),0 6px 20px rgba(0,0,0,.75)}
.intro{opacity:0;animation:intro 1.3s .15s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes intro{from{opacity:0;filter:blur(8px)}to{opacity:1;filter:blur(0)}}
.spacer{flex:1;min-height:0}

/* ================= PLAYER ================= */
.player{position:relative;width:min(340px,calc(100% - 32px));padding:14px 14px 12px;border-radius:26px;margin-bottom:22px;
  background:linear-gradient(160deg,rgba(255,236,205,.20),rgba(255,210,150,.07) 55%),rgba(30,8,14,.50);
  backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5);
  border:1px solid rgba(255,228,176,.28);
  box-shadow:0 22px 60px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.28),inset 0 -20px 40px rgba(246,166,35,.05)}
.row1{display:flex;gap:12px;align-items:center}
.art{flex:none;width:52px;height:52px;border-radius:12px;background:#4a141c center/cover no-repeat;box-shadow:0 6px 16px rgba(0,0,0,.5);border:1px solid rgba(255,225,170,.3);position:relative;overflow:hidden}
.art.live::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 40%,rgba(255,220,150,.32) 50%,transparent 60%);animation:sheen 3.2s linear infinite}
@keyframes sheen{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.meta{min-width:0;flex:1}
.title{font-weight:600;font-size:15px;line-height:1.3;white-space:nowrap;overflow:hidden;color:#fff7e8;
  -webkit-mask:linear-gradient(90deg,#000 92%,transparent);mask:linear-gradient(90deg,#000 92%,transparent)}
.title span{display:inline-block}
.title.mq span{animation:mq 11s ease-in-out infinite alternate}
@keyframes mq{0%,12%{transform:translateX(0)}88%,100%{transform:translateX(calc(-1*var(--d)))}}
.sub{font-size:12px;color:rgba(255,240,215,.76);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.tag{position:absolute;right:18px;bottom:-10px;font-size:9.5px;font-weight:600;letter-spacing:.16em;padding:5px 10px 4px;border-radius:99px;color:var(--ink);
  background:linear-gradient(135deg,#ffe0a0,#f6a623);box-shadow:0 4px 14px rgba(246,166,35,.45),0 0 0 2px rgba(26,7,12,.6)}
.prog{display:flex;align-items:center;gap:10px;margin:8px 0 2px;font-size:11px;color:rgba(255,240,215,.82);font-variant-numeric:tabular-nums}
.prog span{min-width:30px}#dur{text-align:right}
.bar{position:relative;flex:1;height:28px;display:flex;align-items:center;cursor:pointer;touch-action:none;border-radius:8px}
.bar::before{content:"";position:absolute;left:0;right:0;height:4px;border-radius:4px;background:rgba(255,240,215,.22)}
.fill{position:absolute;left:0;height:4px;border-radius:4px;width:0;background:linear-gradient(90deg,var(--marigold),#ff7a3c)}
.knob{position:absolute;left:0;width:14px;height:14px;border-radius:50%;margin-left:-7px;background:#fff6e2;box-shadow:0 0 12px rgba(255,190,90,.95),0 2px 4px rgba(0,0,0,.4);transform:scale(.85);transition:transform .15s}
.bar:hover .knob,.bar.drag .knob,.bar:focus-visible .knob{transform:scale(1.2)}
.row2{display:flex;align-items:center;justify-content:space-between;margin-top:2px}
.ctrls{display:flex;align-items:center;gap:8px}
.btn{position:relative;width:44px;height:44px;border:1px solid rgba(255,228,176,.22);border-radius:50%;display:grid;place-items:center;cursor:pointer;
  background:rgba(255,236,205,.10);color:#fff4dc;transition:background .2s,transform .15s,border-color .2s}
.btn:hover{background:rgba(255,230,180,.2);border-color:rgba(255,228,176,.4)}
.btn:active{transform:scale(.92)}
.btn svg{width:20px;height:20px;fill:currentColor}
.btn:focus-visible,.dial:focus-visible,.socials a:focus-visible,.bar:focus-visible,.credit a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.play{width:58px;height:58px;border:0;color:var(--ink);background:linear-gradient(135deg,#ffe8b0,#f6a623);box-shadow:0 8px 22px rgba(246,166,35,.5),inset 0 1px 0 rgba(255,255,255,.6)}
.play:hover{background:linear-gradient(135deg,#fff3d0,#ffb83a)}
.play svg{width:24px;height:24px}
.play.attn::before{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid rgba(255,210,122,.85);animation:ping 2s ease-out infinite}
.ic-pause{display:none}.playing .ic-pause{display:block}.playing .ic-play{display:none}
.vol{display:flex;align-items:center;gap:10px;color:rgba(255,240,215,.8)}
.vol svg{width:16px;height:16px;fill:currentColor}
.dial{--v:70;position:relative;width:44px;height:44px;border-radius:50%;cursor:grab;touch-action:none;
  background:radial-gradient(circle at 35% 30%,#ffeac0,#c98a2c 55%,#6d3a10);box-shadow:0 5px 12px rgba(0,0,0,.55),inset 0 1px 1px rgba(255,255,255,.65);transform:scale(.8)}
.dial::before{content:"";position:absolute;inset:-6px;border-radius:50%;
  background:conic-gradient(from -135deg,var(--gold) calc(var(--v)*2.7deg),rgba(255,240,215,.2) 0 270deg,transparent 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px))}
.dial i{position:absolute;left:50%;top:6px;width:3px;height:12px;margin-left:-1.5px;border-radius:3px;background:var(--ink);transform-origin:50% 16px}
.dial:active{cursor:grabbing}
.dial.muted{filter:grayscale(.8) brightness(.8)}
.vol-wrap{margin:-6px -4px -6px 0}   /* dial is scaled down visually; keeps the 44px hit area */

.credit{font-size:11px;color:rgba(255,240,215,.72);padding:0 0 max(12px,env(safe-area-inset-bottom,0px));letter-spacing:.03em;text-shadow:0 1px 8px rgba(0,0,0,.85)}
.credit b{color:#ff9d86;font-weight:400}
.credit a{color:inherit;text-decoration:none;border-bottom:1px dotted rgba(255,240,215,.45)}

#spwrap{position:fixed;left:-300px;top:0;width:200px;height:200px;opacity:0;pointer-events:none;overflow:hidden}
.vol-wrap,#next{opacity:.4;pointer-events:none}
@media (max-height:640px){.player{margin-bottom:14px;padding-top:10px}.art{width:44px;height:44px}.play{width:52px;height:52px}}
@media (min-aspect-ratio:1/1) and (min-width:700px){.player{margin-bottom:26px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.intro{opacity:1}}
</style>
</head>
<body>
<main class="stage" id="stage">
  <div class="layer sky"></div>
  <div class="layer stars"></div>
  <div class="moon"></div>
  <div class="skyline"></div>

  <div class="idol-wrap" id="idolWrap" role="img" aria-label="Durga idol with Lakshmi, Saraswati, Kartik and Ganesh at a Puja pandal">
    <div class="rays"></div>
    <div class="idol-glow"></div>
    <div class="idol-bloom"></div>
    <div class="idol"></div>
  </div>

  <div class="garland" aria-hidden="true">
    <svg viewBox="0 0 400 130" preserveAspectRatio="xMidYMin slice"><defs>
      <radialGradient id="mg" cx="40%" cy="35%"><stop offset="0" stop-color="#ffd05a"/><stop offset=".7" stop-color="#f08a14"/><stop offset="1" stop-color="#b8480c"/></radialGradient></defs>
      <g id="gl"></g></svg>
  </div>
  <div class="embers" id="embers" aria-hidden="true"></div>
  <div class="kaash" aria-hidden="true"><svg viewBox="0 0 400 120" preserveAspectRatio="xMidYMax slice" id="kaash"></svg></div>
  <div class="grade"></div>
  <div class="grain"></div>

  <div class="ui">
    <div class="topbar">
      <div class="live glass-chip"><span class="dot"></span><span id="online">32 online</span></div>
      <nav class="socials" aria-label="Social links">
        <a class="glass-chip" href="https://instagram.com/abhigyanbuilds" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24"><path d="M7.5 2h9A5.5 5.5 0 0 1 22 7.5v9a5.5 5.5 0 0 1-5.5 5.5h-9A5.5 5.5 0 0 1 2 16.5v-9A5.5 5.5 0 0 1 7.5 2Zm0 2A3.5 3.5 0 0 0 4 7.5v9A3.5 3.5 0 0 0 7.5 20h9a3.5 3.5 0 0 0 3.5-3.5v-9A3.5 3.5 0 0 0 16.5 4h-9ZM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Zm5.3-3.3a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4Z"/></svg></a>
        <a class="glass-chip" href="https://x.com/abhigyanbuilds" target="_blank" rel="noopener" aria-label="X"><svg viewBox="0 0 24 24"><path d="M17.8 3h3.1l-6.8 7.7L22 21h-6.2l-4.9-6.3L5.3 21H2.2l7.2-8.3L2 3h6.3l4.4 5.8L17.8 3Zm-1.1 16.2h1.7L7.4 4.7H5.6l11.1 14.5Z"/></svg></a>
      </nav>
    </div>

    <h1 class="intro" id="head"><span class="l1">दुर्गा पूजा</span><span class="l2">वो पुरानी यादें</span></h1>
    <div class="spacer"></div>

    <section class="player" id="player" aria-label="Music player">
      <div class="row1">
        <div class="art" id="art"></div>
        <div class="meta"><div class="title" id="title"><span id="titleTxt">Dhaak ki goonj</span></div><div class="sub" id="sub">Tap play to begin</div></div>
      </div>
      <div class="prog">
        <span id="cur">0:00</span>
        <div class="bar" id="bar" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0"><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div>
        <span id="dur">0:00</span>
      </div>
      <div class="row2">
        <div class="ctrls">
          <button class="btn" id="prev" aria-label="Previous track"><svg viewBox="0 0 24 24"><path d="M6 5h2.2v14H6V5Zm3.6 7L19 5v14l-9.4-7Z"/></svg></button>
          <button class="btn play attn" id="play" aria-label="Play">
            <svg class="ic-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z"/></svg>
            <svg class="ic-pause" viewBox="0 0 24 24"><path d="M7 5h3.8v14H7V5Zm6.2 0H17v14h-3.8V5Z"/></svg>
          </button>
          <button class="btn" id="next" aria-label="Next track"><svg viewBox="0 0 24 24"><path d="M15.8 5H18v14h-2.2V5ZM5 5l9.4 7L5 19V5Z"/></svg></button>
        </div>
        <div class="vol">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3Zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4Z"/></svg>
          <div class="vol-wrap"><div class="dial" id="dial" role="slider" aria-label="Volume (tap to mute)" tabindex="0" aria-valuemin="0" aria-valuemax="100"><i id="needle"></i></div></div>
        </div>
      </div>
      <span class="tag">SOOR TAAL</span>
    </section>

    <div class="credit">Made with <b>♥</b> by <a href="https://instagram.com/abhigyanbuilds" target="_blank" rel="noopener">@abhigyanbuilds</a></div>
  </div>
</main>
<div id="spwrap" aria-hidden="true" inert><div id="sp"></div></div>

<script>
/* ================= CONFIG ================= */
const SPOTIFY_URI = 'spotify:playlist:0yqjTnDqWSdxPXyu2aIPdw';
const START_VOL   = 70;

/* ================= SCENE BUILD ================= */
(function(){ // marigold garlands
  const g=document.getElementById('gl'),NS='http://www.w3.org/2000/svg';
  [[0,0,200,70,400,0],[0,6,100,46,200,10],[200,10,300,52,400,6]].forEach(([x1,y1,cx,cy,x2,y2],si)=>{
    const p=document.createElementNS(NS,'path');p.setAttribute('d',`M${x1} ${y1} Q${cx} ${cy} ${x2} ${y2}`);
    p.setAttribute('fill','none');p.setAttribute('stroke','#5a2a10');p.setAttribute('stroke-width','.7');g.appendChild(p);
    const n=si?20:34;
    for(let i=0;i<=n;i++){const t=i/n,x=(1-t)*(1-t)*x1+2*(1-t)*t*cx+t*t*x2,y=(1-t)*(1-t)*y1+2*(1-t)*t*cy+t*t*y2;
      const c=document.createElementNS(NS,'circle');c.setAttribute('cx',x);c.setAttribute('cy',y+3);c.setAttribute('r',si?3.6:4.4);
      c.setAttribute('fill',i%5==3?'#d8402a':'url(#mg)');c.setAttribute('opacity',.95);g.appendChild(c);}
  });
})();
(function(){ // kaash grass
  const s=document.getElementById('kaash');let h='';
  for(let i=0;i<70;i++){
    const x=Math.random()*400,ht=45+Math.random()*65,lean=(Math.random()-.5)*26,w=.7+Math.random()*1.4;
    h+=`<path d="M${x} 122 Q${x+lean*.4} ${122-ht*.55} ${x+lean} ${122-ht}" stroke="rgba(${i%3?'28,8,14':'60,14,18'},.95)" stroke-width="${w}" fill="none" stroke-linecap="round"/>`;
    h+=`<ellipse cx="${x+lean}" cy="${122-ht}" rx="${1.6+Math.random()*1.6}" ry="${5+Math.random()*7}" fill="rgba(255,236,205,${.5+Math.random()*.35})" transform="rotate(${lean*1.6} ${x+lean} ${122-ht})"/>`;
  }
  s.innerHTML=h+'<rect y="110" width="400" height="12" fill="#14040a"/>';
})();
(function(){ // embers
  const e=document.getElementById('embers');
  for(let i=0;i<14;i++){const d=document.createElement('i');
    d.style.left=Math.random()*100+'%';d.style.setProperty('--dx',(Math.random()*60-30)+'px');
    d.style.animationDuration=(7+Math.random()*8)+'s';d.style.animationDelay=(-Math.random()*12)+'s';
    d.style.scale=(.6+Math.random()*1.2);e.appendChild(d);}
})();
(function(){ // decorative online counter (simulated)
  let n=32;const el=document.getElementById('online');
  setInterval(()=>{n=Math.max(24,Math.min(46,n+Math.round((Math.random()-.5)*4)));el.textContent=n+' online'},3800);
})();

/* ================= LAYOUT: size the idol into the gap between headline and player ================= */
(function(){
  const root=document.documentElement.style,head=document.getElementById('head'),pl=document.getElementById('player');
  function fit(){
    const hb=head.getBoundingClientRect().bottom, pt=pl.getBoundingClientRect().top, avail=pt-hb;
    if(avail<=0)return;
    const maxByWidth=(innerWidth*0.96)/(682/450);
    let h=Math.min(avail*1.12, innerHeight*0.5, Math.max(maxByWidth,innerWidth*0.62/(682/450)*1.6));
    h=Math.max(h,Math.min(220,avail));
    const top=hb+(avail-h)/2+avail*0.02;
    root.setProperty('--ih',h+'px');root.setProperty('--it',top+'px');
  }
  addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
  if('ResizeObserver' in window){const ro=new ResizeObserver(fit);ro.observe(head);ro.observe(pl)}
  fit();setTimeout(fit,400);
})();

/* ================= PARALLAX ================= */
(function(){
  const r=document.documentElement.style;let tx=0,ty=0,cx=0,cy=0,sy=0;
  addEventListener('pointermove',e=>{tx=(e.clientX/innerWidth-.5)*2;ty=(e.clientY/innerHeight-.5)*2},{passive:true});
  addEventListener('wheel',e=>{sy=Math.max(-120,Math.min(120,sy+e.deltaY*.3))},{passive:true});
  addEventListener('deviceorientation',e=>{if(e.gamma==null)return;tx=Math.max(-1,Math.min(1,e.gamma/25));ty=Math.max(-1,Math.min(1,(e.beta-50)/30))},{passive:true});
  (function loop(){cx+=(tx-cx)*.06;cy+=(ty-cy)*.06;sy*=.94;
    r.setProperty('--px',cx.toFixed(3));r.setProperty('--py',cy.toFixed(3));r.setProperty('--sy',sy.toFixed(1));requestAnimationFrame(loop)})();
})();

/* ================= PLAYER ================= */
const $=id=>document.getElementById(id);
const fmt=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
let sp,ready=false,userVol=START_VOL,lastVol=START_VOL,seeking=false,pos=0,dur=0,isPlaying=false;

const spTag=document.createElement('script');spTag.src='https://open.spotify.com/embed/iframe-api/v1';spTag.async=true;
spTag.onerror=()=>{$('sub').textContent='Could not reach Spotify — check connection'};
document.head.appendChild(spTag);

window.onSpotifyIframeApiReady=function(API){
  API.createController($('sp'),{uri:SPOTIFY_URI,width:'200',height:'152'},function(c){
    sp=c;
    const f=document.querySelector('#spwrap iframe');if(f)f.setAttribute('tabindex','-1');
    sp.addListener('ready',()=>{ready=true;bindMediaSession()});
    sp.addListener('playback_update',e=>{
      const d=e.data||{};pos=(d.position||0)/1000;dur=(d.duration||0)/1000;
      onState(!d.isPaused);tick();
    });
  });
};

/* cover art only (an image, not a link) — falls back to the existing CSS background */
fetch('https://open.spotify.com/oembed?url='+encodeURIComponent('https://open.spotify.com/'+SPOTIFY_URI.split(':').slice(1).join('/')))
  .then(r=>r.json()).then(j=>{if(j&&j.thumbnail_url)$('art').style.backgroundImage=`url(${j.thumbnail_url})`}).catch(()=>{});

function onState(playing){
  isPlaying=playing;
  $('player').classList.toggle('playing',playing);$('art').classList.toggle('live',playing);
  $('play').setAttribute('aria-label',playing?'Pause':'Play');
  if(playing)$('play').classList.remove('attn');
  if('mediaSession' in navigator)navigator.mediaSession.playbackState=playing?'playing':'paused';
}
function tick(){
  if(!ready||seeking)return;
  const p=dur?Math.min(1,pos/dur):0;
  $('cur').textContent=fmt(pos);$('dur').textContent=fmt(dur);
  $('fill').style.width=(p*100)+'%';$('knob').style.left=(p*100)+'%';$('bar').setAttribute('aria-valuenow',Math.round(p*100));
}
function toggle(){ if(!ready)return;sp.togglePlay() }
function next(){ /* not available in Spotify's embed API */ }
function prev(){ if(!ready)return;sp.seek(0) }
$('play').onclick=toggle;$('next').onclick=next;$('prev').onclick=prev;
addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();toggle()}});

/* lock-screen / headset controls */
function bindMediaSession(){
  if(!('mediaSession' in navigator))return;const m=navigator.mediaSession;
  try{m.setActionHandler('play',()=>sp.resume());m.setActionHandler('pause',()=>sp.pause());
      m.setActionHandler('previoustrack',prev)}catch(e){}
}

/* seek bar */
(function(){
  const bar=$('bar');
  const at=e=>{const r=bar.getBoundingClientRect();return Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))};
  const show=p=>{$('fill').style.width=p*100+'%';$('knob').style.left=p*100+'%';$('cur').textContent=fmt(p*dur)};
  bar.addEventListener('pointerdown',e=>{if(!ready)return;seeking=true;bar.classList.add('drag');bar.setPointerCapture(e.pointerId);show(at(e))});
  bar.addEventListener('pointermove',e=>{if(seeking)show(at(e))});
  bar.addEventListener('pointerup',e=>{if(!seeking)return;seeking=false;bar.classList.remove('drag');sp.seek(at(e)*dur)});
  bar.addEventListener('pointercancel',()=>{seeking=false;bar.classList.remove('drag')});
  bar.addEventListener('keydown',e=>{if(!ready)return;const c=pos||0;
    if(e.key==='ArrowRight'){sp.seek(Math.min(dur,c+5));e.preventDefault()}if(e.key==='ArrowLeft'){sp.seek(Math.max(0,c-5));e.preventDefault()}});
})();

/* volume dial: drag up/down, wheel, arrows, tap to mute */
(function(){
  const dial=$('dial'),needle=$('needle');
  const paint=()=>{needle.style.transform=`rotate(${-135+userVol/100*270}deg)`;dial.style.setProperty('--v',userVol);
    dial.setAttribute('aria-valuenow',Math.round(userVol));dial.classList.toggle('muted',userVol===0)};
  const apply=v=>{userVol=Math.max(0,Math.min(100,v));if(userVol>0)lastVol=userVol;paint()};
  let drag=false,moved=false,sy=0,sv=0;
  dial.addEventListener('pointerdown',e=>{drag=true;moved=false;sy=e.clientY;sv=userVol;dial.setPointerCapture(e.pointerId)});
  dial.addEventListener('pointermove',e=>{if(!drag)return;if(Math.abs(e.clientY-sy)>3)moved=true;if(moved)apply(sv+(sy-e.clientY)*1.2)});
  dial.addEventListener('pointerup',()=>{if(drag&&!moved)apply(userVol>0?0:(lastVol||START_VOL));drag=false});
  dial.addEventListener('pointercancel',()=>drag=false);
  dial.addEventListener('wheel',e=>{e.preventDefault();apply(userVol-e.deltaY*.1)},{passive:false});
  dial.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='ArrowRight'){apply(userVol+5);e.preventDefault()}
    if(e.key==='ArrowDown'||e.key==='ArrowLeft'){apply(userVol-5);e.preventDefault()}});
  paint();
})();
</script>
</body>
</html>
